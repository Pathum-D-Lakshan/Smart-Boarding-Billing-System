{% set bill_view = active_page == 'bills' %}
<form class="pay-filters student-finance-filters" method="get" action="{{ url_for('student_payments.bills' if bill_view else 'student_payments.history') }}">
    <div class="pay-field pay-search"><label for="student-finance-query">{{ 'Bill Reference / Billing Month' if bill_view else 'Payment / Bill / Transfer Reference' }}</label><input id="student-finance-query" name="q" type="search" maxlength="150" value="{{ data.filters.q }}" placeholder="{{ 'e.g. November 2026 or bill reference' if bill_view else 'Search your payment history' }}"></div>
    <div class="pay-field"><label for="student-finance-status">Status</label><select id="student-finance-status" name="status"><option value="">All Statuses</option>{% for key,label in ([('unpaid','Unpaid'),('overdue','Overdue'),('paid','Paid'),('zero','No Payment Due'),('void','Void / Replaced')] if bill_view else statuses.items()) %}<option value="{{ key }}" {% if data.filters.status==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="pay-field"><label for="student-finance-order">Order</label><select id="student-finance-order" name="sort"><option value="newest">Newest First</option><option value="oldest" {% if data.filters.sort=='oldest' %}selected{% endif %}>Oldest First</option></select></div>
    {% if not bill_view %}<details class="student-finance-more"><summary>More filters</summary><div class="pay-form-grid"><div class="pay-field"><label for="student-finance-method">Payment Method</label><select id="student-finance-method" name="method"><option value="">All Methods</option>{% for key,label in methods.items() %}<option value="{{ key }}" {% if data.filters.method==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="pay-field"><label for="student-finance-from">From</label><input id="student-finance-from" type="date" name="from" value="{{ data.filters['from'] }}"></div><div class="pay-field"><label for="student-finance-to">To</label><input id="student-finance-to" type="date" name="to" value="{{ data.filters.to }}"></div></div></details>{% endif %}
    <div class="pay-actions"><button class="pay-button pay-primary" type="submit">Search</button><a class="pay-link" href="{{ url_for('student_payments.bills' if bill_view else 'student_payments.history') }}">Clear Filters</a></div>
</form>
