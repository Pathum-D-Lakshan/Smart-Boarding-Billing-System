{% macro icon(name) -%}
<svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-{{ name }}"></use></svg>
{%- endmacro %}

{% macro navigation_icon(name) -%}
<span class="nav-icon nav-icon-{{ name }}" aria-hidden="true"><svg class="nav-art" focusable="false"><use href="#nav-art-{{ name }}"></use></svg></span>
{%- endmacro %}
