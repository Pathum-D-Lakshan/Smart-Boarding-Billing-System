{% macro password_field(id,errors) -%}
<div class="pay-field"><label for="{{ id }}">Current Owner Password <span aria-hidden="true">*</span></label><div class="pay-password"><input type="password" name="current_password" id="{{ id }}" maxlength="128" autocomplete="current-password" required{% if errors.get('current_password') %} aria-invalid="true" aria-describedby="{{ id }}-error"{% endif %}><button class="pay-eye" type="button" data-pay-eye="{{ id }}" aria-label="Show password" aria-controls="{{ id }}" aria-pressed="false" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>{% if errors.get('current_password') %}<p id="{{ id }}-error" class="pay-error">{{ errors.current_password }}</p>{% endif %}</div>
{%- endmacro %}
