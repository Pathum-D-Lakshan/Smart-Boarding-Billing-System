{% macro password_field(name,label,errors,minimum=0) -%}
<div class="settings-field"><label for="settings-{{ name }}">{{ label }} <span class="settings-required">*</span></label><div class="settings-password"><input type="password" id="settings-{{ name }}" name="{{ name }}" maxlength="128"{% if minimum %} minlength="{{ minimum }}"{% endif %} autocomplete="{{ 'current-password' if name=='current_password' else 'new-password' }}" required{% if errors.get(name) %} aria-invalid="true" aria-describedby="settings-{{ name }}-error"{% endif %}><button type="button" class="settings-eye" data-settings-eye="settings-{{ name }}" aria-controls="settings-{{ name }}" aria-label="Show {{ label|lower }}" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12C5 3 19 3 22 12C19 21 5 21 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>{% if errors.get(name) %}<p class="settings-error" id="settings-{{ name }}-error">{{ errors[name] }}</p>{% endif %}</div>
{%- endmacro %}
