{% from 'shared/_icons.html' import icon %}
<dialog class="jr-details-modal" id="jr-details-dialog" aria-labelledby="jr-modal-title" aria-modal="true" data-login-url="{{ url_for('login') }}">
    <header class="jr-modal-header"><div><p class="jr-modal-eyebrow">OWNER REVIEW</p><h2 id="jr-modal-title">Join Request Details</h2></div><button class="jr-close" id="jr-details-close" type="button" aria-label="Close request details">{{ icon('close') }}</button></header>
    <div class="jr-modal-feedback" id="jr-client-feedback" role="alert" tabindex="-1" hidden></div>
    <div class="jr-modal-tools" id="jr-recovery" hidden><button class="jr-button jr-outline" id="jr-refresh-request" type="button">Refresh Request</button><a class="jr-button" href="{{ url_for('login') }}" id="jr-login-again" hidden>Log In Again</a></div>
    <div class="jr-modal-content" id="jr-dialog-content"><p class="jr-loading" role="status">Loading request details…</p></div>
    <p class="jr-modal-status jr-sr-only" id="jr-modal-status" role="status" aria-live="polite"></p>
</dialog>
